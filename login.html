<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Student Login</title>
<meta name="description" content="Login to your CreateLK Academy student dashboard.">
<meta name="theme-color" content="#155eef">
<link rel="manifest" href="/manifest.json">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033;min-height:100vh}
a{text-decoration:none}
header{height:64px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center}
.nav{width:100%;max-width:1100px;margin:auto;padding:0 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:19px;font-weight:800;color:#155eef}
.register{font-size:12px;font-weight:800;color:#155eef}

.main{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:35px 15px}
.box{width:100%;max-width:420px;background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:30px;box-shadow:0 10px 35px #1720330d}

.icon{width:58px;height:58px;margin:0 auto 15px;border-radius:16px;background:#eaf1ff;color:#155eef;display:grid;place-items:center;font-size:28px}
h1{text-align:center;font-size:27px;margin-bottom:5px}
.subtitle{text-align:center;color:#667085;font-size:13px;margin-bottom:24px}

.group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
input{width:100%;height:44px;padding:0 13px;border:1px solid #d9dee8;border-radius:9px;outline:none;font-size:13px}
input:focus{border-color:#155eef;box-shadow:0 0 0 3px #155eef15}

.password{position:relative}
.password input{padding-right:65px}
.show{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:#155eef;font-size:11px;font-weight:800;cursor:pointer}

button.submit{width:100%;height:46px;border:0;border-radius:9px;background:#155eef;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
button.submit:disabled{opacity:.6;cursor:not-allowed}

.message{display:none;margin-top:15px;padding:11px;border-radius:9px;font-size:12px;text-align:center}
.message.show{display:block}
.success{background:#ecfdf3;color:#027a48;border:1px solid #abefc6}
.error{background:#fef3f2;color:#b42318;border:1px solid #fecdca}

.bottom{text-align:center;margin-top:18px;font-size:12px;color:#667085}
.bottom a{color:#155eef;font-weight:800}

.loader{display:inline-block;width:14px;height:14px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:500px){
.box{padding:24px 18px;border-radius:14px}
h1{font-size:24px}
.logo{font-size:17px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<a href="index.html" class="logo">CreateLK Academy</a>
<a href="register.html" class="register">Create Account →</a>
</div>
</header>

<main class="main">

<div class="box">

<div class="icon">🔐</div>

<h1>Student Login</h1>

<p class="subtitle">
Welcome back! Login to continue learning.
</p>

<form id="loginForm">

<div class="group">
<label for="email">Email Address</label>
<input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required>
</div>

<div class="group">
<label for="password">Password</label>

<div class="password">

<input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required>

<button
type="button"
class="show"
id="showBtn">
Show
</button>

</div>
</div>

<button
id="loginBtn"
class="submit"
type="submit">
Login
</button>

<div id="message" class="message"></div>

</form>

<div class="bottom">
Don't have an account?
<a href="register.html">Register Free</a>
</div>

</div>

</main>

<script>

const API=
"https://createlk-academy-api.createlk.workers.dev";

const form=
document.getElementById("loginForm");

const btn=
document.getElementById("loginBtn");

const msg=
document.getElementById("message");

const password=
document.getElementById("password");

document.getElementById("showBtn").onclick=()=>{

if(password.type==="password"){

password.type="text";
document.getElementById("showBtn").textContent="Hide";

}else{

password.type="password";
document.getElementById("showBtn").textContent="Show";

}

};

function showMessage(text,type){

msg.textContent=text;
msg.className="message show "+type;

}

form.addEventListener("submit",async e=>{

e.preventDefault();

const email=
document.getElementById("email")
.value.trim()
.toLowerCase();

const pass=
password.value;

btn.disabled=true;

btn.innerHTML=
'<span class="loader"></span>Logging in...';

msg.className="message";

try{

const response=
await fetch(
API+"/login",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:pass
})
}
);

let data=null;

try{
data=await response.json();
}catch(e){}

if(!response.ok){

throw new Error(
data?.message ||
data?.error ||
"Invalid email or password."
);

}

if(data && data.success===false){

throw new Error(
data.message ||
data.error ||
"Login failed."
);

}

/*
Save login information
for the dashboard.
*/

if(data.token){

sessionStorage.setItem(
"createlk_token",
data.token
);

}

if(data.student){

sessionStorage.setItem(
"createlk_student",
JSON.stringify(data.student)
);

}

if(data.user){

sessionStorage.setItem(
"createlk_student",
JSON.stringify(data.user)
);

}

showMessage(
"Login successful! Opening your dashboard...",
"success"
);

setTimeout(()=>{

location.href="dashboard.html";

},700);

}catch(error){

console.error(error);

showMessage(
error.message ||
"Unable to login. Please try again.",
"error"
);

btn.disabled=false;
btn.textContent="Login";

}

});

const params=
new URLSearchParams(location.search);

if(params.get("registered")==="1"){

showMessage(
"Account created successfully. Please login.",
"success"
);

}

</script>

</body>
</html>
