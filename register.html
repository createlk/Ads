<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Register</title>
<meta name="description" content="Create your free CreateLK Academy student account.">
<meta name="theme-color" content="#155eef">
<link rel="manifest" href="/manifest.json">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033;min-height:100vh}
a{text-decoration:none}
header{height:64px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center}
.nav{width:100%;max-width:1100px;margin:auto;padding:0 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:19px;font-weight:800;color:#155eef}
.login{font-size:12px;font-weight:800;color:#155eef}

.main{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:35px 15px}
.box{width:100%;max-width:440px;background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:30px;box-shadow:0 10px 35px #1720330d}

.icon{width:58px;height:58px;margin:0 auto 15px;border-radius:16px;background:#eaf1ff;color:#155eef;display:grid;place-items:center;font-size:28px}
h1{text-align:center;font-size:27px;margin-bottom:5px}
.subtitle{text-align:center;color:#667085;font-size:13px;margin-bottom:24px}

.form-group{margin-bottom:15px}
label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
input{width:100%;height:44px;padding:0 13px;border:1px solid #d9dee8;border-radius:9px;outline:none;font-size:13px;background:#fff}
input:focus{border-color:#155eef;box-shadow:0 0 0 3px #155eef15}

.password-wrap{position:relative}
.password-wrap input{padding-right:70px}
.show{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:#155eef;font-size:11px;font-weight:800;cursor:pointer}

.ref{font-size:11px;color:#667085;background:#f7f9fc;border:1px solid #e7ebf2;padding:10px;border-radius:8px;margin-bottom:15px;display:none}
.ref strong{color:#155eef}

.check{display:flex;gap:8px;align-items:flex-start;margin:15px 0;font-size:11px;color:#667085}
.check input{width:15px;height:15px;margin-top:1px}
.check a{color:#155eef;font-weight:700}

button.submit{width:100%;height:46px;border:0;border-radius:9px;background:#155eef;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
button.submit:disabled{opacity:.6;cursor:not-allowed}

.message{display:none;margin-top:15px;padding:11px;border-radius:9px;font-size:12px;text-align:center}
.message.show{display:block}
.success{background:#ecfdf3;color:#027a48;border:1px solid #abefc6}
.error{background:#fef3f2;color:#b42318;border:1px solid #fecdca}

.bottom{text-align:center;margin-top:18px;font-size:12px;color:#667085}
.bottom a{color:#155eef;font-weight:800}

.loader{display:inline-block;width:14px;height:14px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:500px){
.box{padding:24px 18px;border-radius:14px}
h1{font-size:24px}
.logo{font-size:17px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<a href="index.html" class="logo">CreateLK Academy</a>
<a href="login.html" class="login">Student Login →</a>
</div>
</header>

<main class="main">

<div class="box">

<div class="icon">🎓</div>

<h1>Create Your Account</h1>
<p class="subtitle">Start your AI-powered English learning journey.</p>

<div id="refBox" class="ref">
Referral code: <strong id="refCode"></strong>
</div>

<form id="registerForm">

<div class="form-group">
<label for="firstName">First Name</label>
<input id="firstName" name="first_name" type="text" placeholder="Enter your first name" autocomplete="given-name" required>
</div>

<div class="form-group">
<label for="lastName">Last Name</label>
<input id="lastName" name="last_name" type="text" placeholder="Enter your last name" autocomplete="family-name" required>
</div>

<div class="form-group">
<label for="email">Email Address</label>
<input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>
</div>

<div class="form-group">
<label for="phone">Phone Number</label>
<input id="phone" name="phone" type="tel" placeholder="07XXXXXXXX" autocomplete="tel" required>
</div>

<div class="form-group">
<label for="password">Password</label>
<div class="password-wrap">
<input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" minlength="6" required>
<button type="button" class="show" onclick="togglePassword()">Show</button>
</div>
</div>

<div class="check">
<input id="terms" type="checkbox" required>
<label for="terms">
I agree to the
<a href="terms.html">Terms & Conditions</a>
and
<a href="privacy.html">Privacy Policy</a>.
</label>
</div>

<button id="submitBtn" class="submit" type="submit">
Create Free Account
</button>

<div id="message" class="message"></div>

</form>

<div class="bottom">
Already have an account?
<a href="login.html">Login here</a>
</div>

</div>

</main>

<script>

const API="https://createlk-academy-api.createlk.workers.dev";

const form=document.getElementById("registerForm");
const btn=document.getElementById("submitBtn");
const msg=document.getElementById("message");

const refBox=document.getElementById("refBox");
const refCode=document.getElementById("refCode");

const params=new URLSearchParams(location.search);
const urlRef=params.get("ref");

const savedRef=localStorage.getItem("createlk_referral_code");

const referral=
urlRef ||
savedRef ||
"";

if(/^CLK[0-9]{5}$/i.test(referral)){

const code=referral.toUpperCase();

localStorage.setItem(
"createlk_referral_code",
code
);

refBox.style.display="block";
refCode.textContent=code;

}

function togglePassword(){

const input=document.getElementById("password");
const button=document.querySelector(".show");

if(input.type==="password"){
input.type="text";
button.textContent="Hide";
}else{
input.type="password";
button.textContent="Show";
}

}

function showMessage(text,type){

msg.textContent=text;
msg.className="message show "+type;

}

form.addEventListener("submit",async e=>{

e.preventDefault();

const first_name=
document.getElementById("firstName").value.trim();

const last_name=
document.getElementById("lastName").value.trim();

const email=
document.getElementById("email").value.trim().toLowerCase();

const phone=
document.getElementById("phone").value.trim();

const password=
document.getElementById("password").value;

if(password.length<6){

showMessage(
"Password must contain at least 6 characters.",
"error"
);

return;

}

btn.disabled=true;
btn.innerHTML=
'<span class="loader"></span>Creating account...';

showMessage("","success");
msg.classList.remove("show");

try{

const body={
first_name,
last_name,
email,
phone,
password
};

if(/^CLK[0-9]{5}$/i.test(referral)){
body.referral_code=
referral.toUpperCase();
}

const response=
await fetch(
API+"/register",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(body)
}
);

let data=null;

try{
data=await response.json();
}catch(e){}

if(!response.ok){

throw new Error(
data?.message ||
data?.error ||
"Registration failed. Please try again."
);

}

if(data && data.success===false){

throw new Error(
data.message ||
data.error ||
"Registration failed."
);

}

showMessage(
"Account created successfully! Redirecting to login...",
"success"
);

localStorage.removeItem(
"createlk_referral_code"
);

setTimeout(()=>{
location.href="login.html?registered=1";
},1200);

}catch(error){

console.error(error);

showMessage(
error.message ||
"Unable to create your account. Please try again.",
"error"
);

btn.disabled=false;
btn.textContent="Create Free Account";

}

});

</script>

</body>
</html>
